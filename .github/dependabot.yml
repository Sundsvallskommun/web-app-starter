version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule: &weekly-schedule
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    groups: &dependency-groups
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore: &major-updates
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message: &dependency-commit-message
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /backend
    schedule: *weekly-schedule
    open-pull-requests-limit: 5
    groups: *dependency-groups
    ignore: *major-updates
    commit-message: *dependency-commit-message

  - package-ecosystem: npm
    directory: /frontend
    schedule: *weekly-schedule
    open-pull-requests-limit: 5
    groups: *dependency-groups
    ignore: *major-updates
    commit-message: *dependency-commit-message

  - package-ecosystem: npm
    directory: /admin
    schedule: *weekly-schedule
    open-pull-requests-limit: 5
    groups: *dependency-groups
    ignore: *major-updates
    commit-message: *dependency-commit-message
