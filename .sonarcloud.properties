# SonarCloud Automatic Analysis configuration for the web-app-starter monorepo.

# Generated API clients (swagger-typescript-api) and build/test artefacts are not source.
sonar.exclusions=**/data-contracts/**,**/.next/**,**/dist/**,**/coverage/**,**/node_modules/**,**/middleware-envs.js,**/*.config.js

# This monorepo holds three packages. `frontend` and `admin` are separate apps that intentionally
# share the same tooling config (eslint/vitest/playwright), the same test/e2e scaffolding, and the
# same backend-client patterns (services/utils). That cross-app parallelism is by design and would
# otherwise inflate "duplication on new code", so it is excluded from copy-paste detection.
sonar.cpd.exclusions=**/data-contracts/**,**/*.config.ts,**/*.config.mjs,**/eslint.config.mjs,**/vitest.config.ts,**/vitest.setup.ts,**/playwright.config.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/e2e/**,**/src/services/**,**/src/utils/**

# Two SonarCloud rules conflict with / are less precise than this repo's enforced ESLint config,
# which is the source of truth (lint:strict is a blocking gate). Disable them here:
#  - S3735 ("remove void operator"): we use `void promise` deliberately, as required by
#    @typescript-eslint/no-floating-promises (the canonical fire-and-forget pattern).
#  - S4325 ("redundant assertion"): @typescript-eslint/no-unnecessary-type-assertion already flags
#    truly-redundant assertions using full type information; the ones here are required by tsc.
sonar.issue.ignore.multicriteria=eslintVoid,eslintAssert
sonar.issue.ignore.multicriteria.eslintVoid.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.eslintVoid.resourceKey=**/*
sonar.issue.ignore.multicriteria.eslintAssert.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.eslintAssert.resourceKey=**/*
