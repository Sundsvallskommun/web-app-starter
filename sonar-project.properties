# SonarCloud analysis configuration for the web-app-starter monorepo.

# Generated API clients (swagger-typescript-api) and build/test artefacts are not source.
sonar.exclusions=**/data-contracts/**,**/.next/**,**/dist/**,**/coverage/**,**/node_modules/**,**/middleware-envs.js,**/*.config.js

# Per-package tooling config, test setup and e2e specs are intentionally near-identical across
# backend/frontend/admin (each package is self-contained). Exclude this boilerplate from the
# copy-paste / duplication detector so it doesn't inflate "duplication on new code".
sonar.cpd.exclusions=**/data-contracts/**,**/*.config.ts,**/*.config.mjs,**/eslint.config.mjs,**/vitest.config.ts,**/vitest.setup.ts,**/playwright.config.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/e2e/**
